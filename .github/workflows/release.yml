name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: scout-linux-x64
          - os: macos-latest
            asset: scout-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path scout/Cargo.toml

      - name: Strip and rename
        run: |
          cp scout/target/release/scout ${{ matrix.asset }}
          strip ${{ matrix.asset }} || true

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
