[package]
name = "scout"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Lightweight browser automation runtime with an authenticated HTTP API"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "io-std"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service", "http1", "http2"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream", "cookies", "json"] }
cookie_store = "0.21"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
scraper = "0.20"
ego-tree = "0.6"
rquickjs = { version = "0.6", features = ["loader"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
serde_urlencoded = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
