# Container deployment config for the Rust runtime.
#
# NOT verified: no Docker daemon in the authoring sandbox. The resource limits
# below are the ones the design assumes (the process itself enforces its own
# soft/hard memory budget through SCOUT_MEM_SOFT_MB / SCOUT_MEM_HARD_MB, so the
# cgroup cap is a backstop and should sit above the hard budget).
services:
  scout:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Required: 16+ characters per key, comma separated. Set it in the host
      # environment or an .env file; never commit a real key.
      SCOUT_API_KEYS: "${SCOUT_API_KEYS:?set SCOUT_API_KEYS}"
      SCOUT_METRICS_TOKEN: "${SCOUT_METRICS_TOKEN:-}"
      SCOUT_CONCURRENCY: "2"
      SCOUT_MAX_QUEUED: "16"
      SCOUT_MAX_SESSIONS: "8"
      SCOUT_MEM_SOFT_MB: "300"
      SCOUT_MEM_HARD_MB: "400"
      SCOUT_LOG_LEVEL: "info"
    deploy:
      resources:
        limits:
          # Above SCOUT_MEM_HARD_MB so the runtime's own watchdog fires first and
          # can report resource_limit instead of the kernel killing the process.
          memory: 512M
          # The 0.1 CPU design target, held rather than rounded up. Derived from
          # measured CPU time, not from a cgroup run (no daemon here): the heaviest
          # recorded scenario costs 53.5 ms of CPU per task, i.e. ~535 ms wall at
          # 0.1 CPU — two orders of magnitude inside the 60 s task timeout. Raise
          # this only if a measured workload actually needs it.
          cpus: "0.1"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
