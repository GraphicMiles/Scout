<!doctype html><html><head><meta charset="utf-8"><title>10-float</title><style>
*{margin:0;padding:0}
body{font:16px/1.4 'DejaVu Sans';width:800px}

.fl{float:left;width:100px;height:60px;background:#bbb;margin-right:10px}
.clear{clear:both}
</style></head><body>
<div class="fl"></div>
<p>The text beside a float wraps around it, and this paragraph is long enough to run past the bottom of the floated box so the second line is full width.</p>
<p class="clear">After the clear.</p>
</body></html>
