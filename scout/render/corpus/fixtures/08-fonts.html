<!doctype html><html><head><meta charset="utf-8"><title>08-fonts</title><style>
*{margin:0;padding:0}
body{font:16px/1.4 'DejaVu Sans';width:800px}

.a{font-size:12px}
.b{font-size:20px}
.c{font-size:32px;font-weight:bold}
.d{font-size:16px;font-style:italic}
.e{font-size:16px;line-height:2}
.f{font-size:16px;line-height:12px}
</style></head><body>
<p class="a">Twelve pixel text</p>
<p class="b">Twenty pixel text</p>
<p class="c">Bold thirty two</p>
<p class="d">Italic sixteen</p>
<p class="e">Double line height</p>
<p class="f">Tight line height</p>
</body></html>
