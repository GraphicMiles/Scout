<!doctype html><html><head><meta charset="utf-8"><title>05-text-align</title><style>
*{margin:0;padding:0}
body{font:16px/1.4 'DejaVu Sans';width:800px}

p{width:300px;margin-bottom:8px;background:#f4f4f4}
.l{text-align:left}.c{text-align:center}.r{text-align:right}.j{text-align:justify}
</style></head><body>
<p class="l">Left aligned text here</p>
<p class="c">Center aligned text here</p>
<p class="r">Right aligned text here</p>
<p class="j">Justified text is stretched so that every line except the last one fills the whole width of the paragraph exactly.</p>
</body></html>
