<!doctype html><html><head><meta charset="utf-8"><title>09-whitespace</title><style>
*{margin:0;padding:0}
body{font:16px/1.4 'DejaVu Sans';width:800px}

.nw{white-space:nowrap;width:100px}
.pre{white-space:pre}
.pw{white-space:pre-wrap;width:150px}
.wrapword{width:120px;word-wrap:break-word}
</style></head><body>
<p class="nw">This line will not wrap at all</p>
<p class="pre">  spaced    out  </p>
<p class="pw">keeps   these
breaks</p>
<p class="wrapword">aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa</p>
</body></html>
