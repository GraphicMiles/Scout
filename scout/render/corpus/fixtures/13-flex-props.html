<!doctype html><html><head><meta charset="utf-8"><title>13-flex-props</title><style>
*{margin:0;padding:0}
body{font:16px/1.4 'DejaVu Sans';width:800px}

.jc{display:flex;justify-content:space-between;width:500px;height:50px}
.jc>div{width:60px;background:#ddd}
.ac{display:flex;align-items:center;width:400px;height:80px;background:#f0f0f0}
.ac>div{height:20px;width:80px;background:#888}
.wrap{display:flex;flex-wrap:wrap;width:300px}
.wrap>div{width:120px;height:30px;background:#ccc;margin:0 4px 4px 0}
</style></head><body>
<div class="jc"><div></div><div></div><div></div></div>
<div class="ac"><div></div></div>
<div class="wrap"><div></div><div></div><div></div></div>
</body></html>
