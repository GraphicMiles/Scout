<!doctype html><html><head><meta charset="utf-8"><title>15-cascade</title><style>
*{margin:0;padding:0}
body{font:16px/1.4 'DejaVu Sans';width:800px}

div{height:20px;background:rgb(200,200,200)}
.target{height:30px}
#id-target{height:40px;background:rgb(10,20,30)}
p{color:rgb(255,0,0)}
p.special{color:rgb(0,128,0)}
p{color:rgb(0,0,255)}
.imp{color:rgb(1,2,3)!important}
:root{--brand:rgb(90,40,200)}
.varcolor{color:var(--brand)}
</style></head><body>
<div id="id-target" class="target">id wins</div>
<div class="target">class wins</div>
<p class="special">green beats later red</p>
<p class="special imp">important</p>
<p class="varcolor">custom property</p>
</body></html>
