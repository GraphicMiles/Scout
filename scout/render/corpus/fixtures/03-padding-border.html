<!doctype html><html><head><meta charset="utf-8"><title>03-padding-border</title><style>
*{margin:0;padding:0}
body{font:16px/1.4 'DejaVu Sans';width:800px}

.content{box-sizing:content-box;width:200px;height:40px;padding:10px;border:3px solid #000}
.borderbox{box-sizing:border-box;width:200px;height:40px;padding:10px;border:3px solid #000}
.asym{width:120px;height:30px;padding:4px 8px 12px 16px;border:1px solid;border-width:1px 2px 3px 4px}
</style></head><body>
<div class="content"></div><div class="borderbox"></div><div class="asym"></div>
</body></html>
